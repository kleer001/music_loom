# juke-box settings. Copy this file to config.toml and edit the copy.
# config.toml belongs to one machine and is not tracked.

# The running ComfyUI that renders the songs.
comfyui_url = "http://127.0.0.1:8188"

# Where scripts/download_models.sh puts the MiniMax Music 3 files (about 14.3 GB).
# Use your ComfyUI's models directory, or a base path that your
# extra_model_paths.yaml maps. The files go into diffusion_models/,
# text_encoders/ and vae/ under it. The directory must exist.
models_dir = "~/ComfyUI/models"

# Optional. ComfyUI's log file. When set, run_prompt.sh saves the job's log lines.
# comfyui_log = "~/ComfyUI/comfyui.log"
